name: Mobile CI

# Flutter project at the repo root (mobile-only repo).
# Runs on every PR / push to dev and main.
#   - analyze + test:     always
#   - Android build:      always (cheap on Linux runners)
#   - iOS build:          only when ios/ or pubspec changed (macOS minutes are ~10x)
# Branch protection: require ONE check, "CI gate". It passes when the iOS job
# was skipped, so a skipped job can never leave a required check pending.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/mobile-ci.yml'

  analyze-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable    # pin with flutter-version once the team settles on one
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android-build:
    name: Android build check
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

  ios-build:
    name: iOS build check
    needs: [changes, analyze-test]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --no-codesign

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, analyze-test, android-build, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Everything that ran must have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")'
