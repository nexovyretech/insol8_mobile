name: Mobile CD (UAT beta on AWS)

# Beta builds only. The APK is uploaded to a private S3 bucket; testers sign in to the
# Cognito-protected portal to download it. No app-store release at prototype stage.
# Trigger: push a tag such as  v0.4.0   (or run manually from the Actions tab).
#
# Variables (Settings -> Environments -> production -> Variables):
#   AWS_REGION       region you deployed the stack to (ap-southeast-2)
#   BUILDS_BUCKET    stack output BuildsBucketName
#   API_BASE_URL     the backend URL baked into the app
#   PORTAL_URL       (optional) stack output PortalUrl, shown in the run summary
# Secrets (same environment):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   access key of the stack's upload-only IAM user
#                                               (stack output UploadUserName). It can only put
#                                               objects under builds/ in the builds bucket.
#   ANDROID_KEYSTORE_*                          used to sign the APK (see "Set up release signing")
# GitHub OIDC would avoid the stored key, but the AWS free-plan organization policy blocks
# creating the OIDC provider on this account.
#
# If your repo is private on a plan without Environments, delete the `environment:` line
# and store the variables and secrets at repository level instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_notes:
        description: What testers should look at
        required: false
        default: Manual build

permissions:
  contents: read

jobs:
  distribute:
    name: Build APK + upload to AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      # --no-fatal-infos: newer stable Flutter (3.47+) deprecates package:flutter/material.dart,
      # which every screen imports. Those are infos; warnings and errors still fail the job.
      # Drop the flag once the app migrates to package:material_ui (or Flutter is pinned).
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Recreates the release keystore from secrets so every build is signed with the same key.
      # Secrets (Settings -> Environments -> production -> Secrets):
      #   ANDROID_KEYSTORE_BASE64   base64 of upload-keystore.jks
      #   ANDROID_KEYSTORE_PASSWORD keystore password
      #   ANDROID_KEY_ALIAS         key alias (e.g. upload)
      #   ANDROID_KEY_PASSWORD      key password
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --build-number=${{ github.run_number }}

      # Kept as a workflow artifact too, so an older build can always be re-uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: insol8-app-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload APK to S3
        env:
          BUCKET: ${{ vars.BUILDS_BUCKET }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          RUN: ${{ github.run_number }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          NOTES_RAW: ${{ inputs.release_notes || format('Build {0}', github.run_number) }}
        run: |
          # S3 metadata must be plain ASCII on one line, so strip everything else.
          NOTES="$(printf '%s' "$NOTES_RAW" | LC_ALL=C tr -cd '[:print:]' | cut -c1-200)"
          METADATA="$(jq -nc --arg version "$VERSION" --arg run "$RUN" --arg commit "$COMMIT" --arg notes "$NOTES" \
            '{version:$version, run:$run, commit:$commit, notes:$notes}')"

          aws s3 cp build/app/outputs/flutter-apk/app-release.apk \
            "s3://$BUCKET/builds/$RUN/insol8-$RUN.apk" \
            --content-type application/vnd.android.package-archive \
            --metadata "$METADATA"

          {
            echo "### Beta build $RUN uploaded"
            echo "- Version/ref: \`$VERSION\`"
            echo "- Commit: \`$COMMIT\`"
            if [ -n "$PORTAL_URL" ]; then echo "- Testers download it at: $PORTAL_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
